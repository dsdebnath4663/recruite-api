# ========================
# Application Information
# ========================
spring.application.name=Recruite Application

# ========================
# Server Configuration
# ========================
server.port=8080




# ========================
# Security Configuration
# ========================
# Default in-memory user for basic authentication
spring.security.user.name=admin
spring.security.user.password=admin123
# Uncomment to set default roles
# spring.security.user.roles=USER

# ========================
# Logging Configuration
# ========================
# Logging levels for application
logging.level.org.springframework.security=TRACE
logging.level.org.springframework.web=DEBUG
logging.level.com.recruitment.service=DEBUG

# ========================
# Enable JPA debug logging for Hibernate
# ========================
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql=TRACE

# ========================
# OpenAPI/Swagger Configuration
# ========================
bezkoder.openapi.dev-url=http://localhost:8080
bezkoder.openapi.prod-url=https://www.google.com



# ========================
# Configure Mail Properties
# ========================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=
spring.mail.password=

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.debug=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000



# Set the active profile
spring.profiles.active=postgres
